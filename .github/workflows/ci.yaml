name: ci

# Fork CI: needs no repository secrets. Publishing images is release work and
# stays manual. Job names (lint, types, unit, integration) are stable so branch
# protection can require them; conformance and nextflow-e2e are deliberately
# not required yet (nextflow-e2e: until it passes reliably, issue #7).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; keep every run on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: lint placeholder
        # TODO: replace with ruff / pre-commit in the process-setup issue.
        run: echo "No linters configured yet."

  types:
    runs-on: ubuntu-latest
    steps:
      - name: types placeholder
        # TODO: replace with mypy in the process-setup issue.
        run: echo "No type checker configured yet."

  unit:
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@v7

      - name: set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: install dependencies
        run: pip install . "pytest>=7.1,<8"

      - name: run unit tests
        run: pytest tests/unit

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Every docker compose call below uses the override, which caps tesp-api at 512 MiB (no swap) for
      # tests/large_file_tests.py. The smoke tests run under the same cap.
      COMPOSE_FILE: docker-compose.yaml:tests/compose.mem-limit.yaml
    steps:
      - name: check out repository
        uses: actions/checkout@v7

      - name: set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: start compose stack
        run: docker compose --profile pulsar up -d --build

      - name: install test dependencies
        run: pip install . "pytest>=7.1,<8" flask

      - name: wait for tesp-api
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8080/v1/service-info; then
              echo "tesp-api is up"
              exit 0
            fi
            sleep 5
          done
          echo "tesp-api did not answer on :8080 within 5 minutes" >&2
          exit 1

      - name: wait for pulsar
        run: |
          for _ in $(seq 1 60); do
            # Any HTTP response means Pulsar is listening.
            if docker compose --profile pulsar exec -T pulsar_rest curl -sS -o /dev/null http://localhost:8913/; then
              echo "pulsar is up"
              exit 0
            fi
            sleep 5
          done
          echo "pulsar did not answer on :8913 within 5 minutes" >&2
          exit 1

      - name: start upload server
        run: |
          nohup python tests/upload_server.py > upload_server.log 2>&1 &
          for _ in $(seq 1 30); do
            # Any HTTP response (even 404) means Flask is listening.
            if curl -sS -o /dev/null http://localhost:5000/; then
              exit 0
            fi
            sleep 1
          done
          echo "upload server did not start" >&2
          cat upload_server.log
          exit 1

      - name: run smoke tests
        run: pytest tests/smoke_tests.py

      - name: run large-file tests
        # 1 GiB through S3 and HTTP inputs and outputs, with tesp-api capped at 512 MiB (issue #6).
        run: pytest -s tests/large_file_tests.py

      - name: show disk usage
        if: always()
        run: df -h / /opt/pysetup/files/staging || true

      - name: dump logs on failure
        if: failure() || cancelled()
        run: |
          docker compose --profile pulsar ps -a
          docker compose --profile pulsar logs --no-color
          cat upload_server.log || true

  # GA4GH TES conformance audit (issue #2). Known failures are tracked as
  # tes-compliance sub-issues of #2, so for now they only raise a warning.
  # To make the job required once those are closed: drop both
  # continue-on-error keys, drop the "flag failures" step, and add
  # `conformance` to branch protection.
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Infrastructure failures (stack never starts, timeout); integration catches those too.
    continue-on-error: true
    steps:
      - name: check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: start compose stack
        run: docker compose --profile pulsar up -d --build

      - name: wait for tesp-api
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8080/v1/service-info; then
              echo "tesp-api is up"
              exit 0
            fi
            sleep 5
          done
          echo "tesp-api did not answer on :8080 within 5 minutes" >&2
          exit 1

      - name: wait for pulsar
        run: |
          for _ in $(seq 1 60); do
            # Any HTTP response means Pulsar is listening.
            if docker compose --profile pulsar exec -T pulsar_rest curl -sS -o /dev/null http://localhost:8913/; then
              echo "pulsar is up"
              exit 0
            fi
            sleep 5
          done
          echo "pulsar did not answer on :8913 within 5 minutes" >&2
          exit 1

      - name: run conformance suite
        id: suite
        # Failing conformance tests keep the job green until the sub-issues of #2 are closed.
        continue-on-error: true
        env:
          # Outside the checkout: compose bind-mounts it into the auto-reloading tesp-api container.
          WORK_DIR: ${{ runner.temp }}/conformance
          POLL_TIMEOUT: "300"
          RUN_TIMEOUT: "1500"
        run: bash tests/conformance.sh

      - name: publish summary
        if: always()
        run: cat "$RUNNER_TEMP"/conformance/report/*/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: flag failures
        if: steps.suite.outcome == 'failure'
        run: |
          if [ "$(cat "$RUNNER_TEMP/conformance/report/exit-code" 2>/dev/null)" = 1 ]; then
            echo "::warning title=TES conformance::The suite reported failures; see the job summary and the conformance-report artefact."
          else
            echo "::error title=TES conformance::The conformance run broke before finishing; see the step log and run.log in the conformance-report artefact."
          fi

      - name: collect compose logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/conformance/report"
          docker compose --profile pulsar logs --no-color > "$RUNNER_TEMP/conformance/report/compose.log" 2>&1 || true

      - name: upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-report
          path: ${{ runner.temp }}/conformance/report/
          if-no-files-found: error
          retention-days: 14

  # A real TES client end to end (issue #7): Nextflow with the nf-ga4gh plugin,
  # its work directory on the compose MinIO, every process run through
  # tesp-api -> Pulsar. See tests/README.md, "Nextflow end-to-end test".
  nextflow-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NXF_VER: "25.10.8"
      # sha256 of nextflow-${NXF_VER}-dist from the GitHub release; bump together with NXF_VER.
      # The nf-ga4gh plugin version is pinned in tests/e2e/nextflow/nextflow.config.
      NXF_DIST_SHA256: "6ee8ab223c92a15870f12fb3685f0b43d1fc1913d806c2bb75571dd7e6cdb449"
      S3_ENDPOINT: http://172.17.0.1:9000
      # Test credentials of the compose MinIO service, not secrets.
      AWS_ACCESS_KEY_ID: tesp-test
      AWS_SECRET_ACCESS_KEY: tesp-test-secret
      AWS_DEFAULT_REGION: us-east-1  # for the aws CLI; MinIO ignores it
      # Same stack as the integration job: tesp-api capped at 512 MiB.
      COMPOSE_FILE: docker-compose.yaml:tests/compose.mem-limit.yaml
    steps:
      - name: set paths
        # Outside the checkout: compose bind-mounts it into the auto-reloading tesp-api container.
        run: |
          echo "E2E_DIR=$RUNNER_TEMP/nextflow-e2e" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/nextflow-e2e/bin" "$RUNNER_TEMP/nextflow-e2e/logs"

      - name: check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: start compose stack
        run: docker compose --profile pulsar up -d --build

      - name: install Nextflow
        run: |
          curl -fsSL -o "$E2E_DIR/bin/nextflow" \
            "https://github.com/nextflow-io/nextflow/releases/download/v${NXF_VER}/nextflow-${NXF_VER}-dist"
          echo "$NXF_DIST_SHA256  $E2E_DIR/bin/nextflow" | sha256sum -c -
          chmod +x "$E2E_DIR/bin/nextflow"
          echo "$E2E_DIR/bin" >> "$GITHUB_PATH"

      - name: wait for tesp-api
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8080/v1/service-info; then
              echo "tesp-api is up"
              exit 0
            fi
            sleep 5
          done
          echo "tesp-api did not answer on :8080 within 5 minutes" >&2
          exit 1

      - name: wait for pulsar
        run: |
          for _ in $(seq 1 60); do
            # Any HTTP response means Pulsar is listening.
            if docker compose --profile pulsar exec -T pulsar_rest curl -sS -o /dev/null http://localhost:8913/; then
              echo "pulsar is up"
              exit 0
            fi
            sleep 5
          done
          echo "pulsar did not answer on :8913 within 5 minutes" >&2
          exit 1

      - name: create bucket
        # The aws CLI comes with the ubuntu-latest runner image.
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "$S3_ENDPOINT/minio/health/ready"; then
              aws --endpoint-url "$S3_ENDPOINT" s3 mb s3://nextflow-e2e
              exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become ready within 1 minute" >&2
          exit 1

      - name: run pipeline
        timeout-minutes: 20
        env:
          NXF_ANSI_LOG: "false"
          NXF_E2E_WORK_DIR: s3://nextflow-e2e/work
        run: |
          cd "$E2E_DIR"
          export NXF_HOME="$E2E_DIR/home"
          nextflow -log "$E2E_DIR/logs/nextflow.log" run "$GITHUB_WORKSPACE/tests/e2e/nextflow/main.nf" \
            -c "$GITHUB_WORKSPACE/tests/e2e/nextflow/nextflow.config" \
            --outdir "$E2E_DIR/results"

      - name: check output
        run: |
          expected="HELLO FROM TESP-API"
          actual="$(cat "$E2E_DIR/results/shout.txt")"
          if [ "$actual" != "$expected" ]; then
            echo "::error title=Nextflow e2e::shout.txt is '$actual', expected '$expected'"
            exit 1
          fi
          echo "shout.txt: $actual"
          # Both processes must have gone through tesp-api, not run anywhere else.
          complete="$(curl -fsS "http://localhost:8080/v1/tasks?view=MINIMAL" | jq '[.tasks[] | select(.state == "COMPLETE")] | length')"
          if [ "$complete" -lt 2 ]; then
            echo "::error title=Nextflow e2e::tesp-api has $complete COMPLETE tasks, expected at least 2"
            exit 1
          fi
          echo "tesp-api COMPLETE tasks: $complete"

      # Runs on success too: a leak is a failure even when the pipeline passes.
      # Covers the files uploaded below, not the step output above.
      - name: collect and scan logs
        id: logs
        if: always()
        run: |
          cd "$E2E_DIR/logs"
          # COMPOSE_FILE is relative to the checkout.
          (cd "$GITHUB_WORKSPACE" && docker compose --profile pulsar logs --no-color) > compose.log 2>&1 || true
          # The TES view of every task Nextflow submitted (stored s3:// URLs, states, executor logs).
          curl -fsS "http://localhost:8080/v1/tasks?view=FULL" > tasks.json 2>&1 || true
          # Never upload credentials or presigned URLs. A leak fails the job (and names the files);
          # the leaking lines are then replaced so the rest of the logs can still be uploaded.
          # -a and LC_ALL=C: Docker logs may hold binary bytes, which grep would otherwise skip.
          pattern='x-amz-signature|x-amz-credential|x-amz-security-token|awsaccesskeyid|tesp-test-secret'
          status=0
          leaks="$(LC_ALL=C grep -aEilr "$pattern" .)" || status=$?
          if [ "$status" -ge 2 ]; then
            echo "::error title=Nextflow e2e::Log scan failed; not uploading the logs."
            exit 1
          fi
          for f in $leaks; do
            n="$(LC_ALL=C grep -aEic "$pattern" "$f")"
            echo "::error title=Nextflow e2e::$f has $n lines with credentials or presigned URLs; they are replaced in the artefact."
            LC_ALL=C sed -Ei "/$pattern/I c [line removed by CI: credentials or presigned URL]" "$f"
          done
          if LC_ALL=C grep -aEilr "$pattern" .; then
            echo "::error title=Nextflow e2e::Redaction failed; not uploading the logs."
            exit 1
          fi
          echo "clean=true" >> "$GITHUB_OUTPUT"
          [ -z "$leaks" ]

      - name: upload logs
        if: (failure() || cancelled()) && steps.logs.outputs.clean == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nextflow-e2e-logs
          path: ${{ runner.temp }}/nextflow-e2e/logs/
          if-no-files-found: error
          retention-days: 14
