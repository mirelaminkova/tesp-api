# Keeps the digest-pinned Docker base images (#9), the workflow actions and the Python
# dependencies (pyproject.toml + poetry.lock) current (issue #11).
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /docker/tesp_api
      - /docker/pulsar_rest
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # "pip" covers Poetry: Dependabot reads pyproject.toml and updates poetry.lock.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch bumps in one PR; each major bump gets its own PR.
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
