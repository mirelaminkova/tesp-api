version: '3.8'

services:

  service-s3:
    # minio/minio is no longer published on Docker Hub; this is Bitnami's frozen MinIO build (as in ../../docker-compose.yaml).
    # It starts the server with the console on :9001 itself and keeps its data in /bitnami/minio/data.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./s3/data:/bitnami/minio/data
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: 123456789

  service-ftp:
    build:
      context: ./ftp/
    image: ftp
    ports:
      - '2121-2130:2121-2130'
    depends_on:
      - service-s3

  service-http:
    build:
      context: ./http/
    image: http
    ports:
      - "5000:5000"
    volumes:
      - ../../tests/test_data:/data
      - ../../tests/uploaded_data:/data/uploaded_data

  tests-clients:
    build:
      context: ./clients/
    image: clients
    depends_on:
      - tests-clients-init      

  tests-clients-init:
    build:
      context: ./clients/
      dockerfile: Dockerfile.tests-init    
    depends_on:
      - service-s3
      - service-ftp
      - service-http


