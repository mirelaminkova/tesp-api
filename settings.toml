[default]
db.mongodb_uri = "mongodb://localhost:27017"
pulsar.url = "http://localhost:8913"
pulsar.status.poll_interval = 4
pulsar.status.max_polls = 400
pulsar.client_timeout = 30
# Per-job DRMAA native specification built from the task's TES resources, used when Pulsar submits to a batch system
# through a DRMAA manager (e.g. SLURM) that has no native_specification of its own. Each template is used only when the
# task requests that resource. Placeholders: {cpu_cores}, {ram_gb}, {ram_mb} (ram_gb in whole MiB, rounded up).
pulsar.native_specification.cpu_cores = ""  # e.g. "--cpus-per-task={cpu_cores}" for SLURM
pulsar.native_specification.ram_gb = ""     # e.g. "--mem={ram_mb}" for SLURM

# Put TES resources (cpu_cores, ram_gb) on the container command line as --cpus/--memory:
# "auto" for docker only, "always" for docker and singularity, "never" for neither. Apptainer needs a usable cgroups
# manager (cgroups v2 with systemd or delegation) for these flags and fails the task without one.
container.resource_limits = "auto"

logging.level = "DEBUG"
logging.output_json = false

oauth.enable = false
basic_auth.enable = false
basic_auth.username = "user"
basic_auth.password = "password"

# S3 inputs and outputs given as s3://bucket/key. Set credentials in .secrets.toml or in the environment
# (TESP_API_S3__ACCESS_KEY_ID, TESP_API_S3__SECRET_ACCESS_KEY), never in this file.
s3.endpoint_url = ""              # e.g. "https://s3.example.org"; empty means AWS S3
s3.region = "us-east-1"
s3.access_key_id = ""             # empty means anonymous access (public buckets only)
s3.secret_access_key = ""
s3.addressing_style = "path"      # "path", "virtual" or "auto"
s3.presign_expiry_seconds = 3600  # lifetime of the download URLs handed to Pulsar
s3.output_presign_expiry_seconds = 86400  # lifetime of the upload URLs; must cover the whole run of a task

[dev-docker]
db.mongodb_uri = "mongodb://tesp-db:27017"
pulsar.url = "http://pulsar_rest:8913"
logging.output_json = false
