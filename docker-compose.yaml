services:
  tesp-api:
    build:
      context: ./
      dockerfile: docker/tesp_api/Dockerfile
      target: development
    image: tesp-api
    environment:
      - CONTAINER_TYPE=singularity  # Set to "docker", "singularity", or "both"
      # S3 inputs (s3://bucket/key) are read from the MinIO test service below (profile "pulsar").
      # The endpoint must be reachable from the staging containers that Pulsar starts.
      - TESP_API_S3__ENDPOINT_URL=http://172.17.0.1:9000
      - TESP_API_S3__ACCESS_KEY_ID=tesp-test
      - TESP_API_S3__SECRET_ACCESS_KEY=tesp-test-secret  # local test credentials only
      # Quick Pulsar status polling for the tests. The legacy poll limit (5 × 1 s) is far shorter than
      # tests/smoke_tests.py::test_task_outlives_legacy_poll_limit; it is deprecated and ignored (issue #49).
      - TESP_API_PULSAR__STATUS__POLL_INTERVAL=1
      - TESP_API_PULSAR__STATUS__MAX_POLL_INTERVAL=2
      - TESP_API_PULSAR__STATUS__MAX_POLLS=5
    container_name: tesp-api
    privileged: true
    ports:
      - "8080:8080"
    depends_on:
      - tesp-db
    volumes:
      - ./:/app
      - /opt/pysetup/files/staging/:/opt/pysetup/files/staging/
      #    extra_hosts:
      #      - "host.docker.internal:host-gateway"

  tesp-db:
    image: mongo:latest
    container_name: tesp-db
    volumes:
      - ./docker/mongodb/data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=tesp
    ports:
      - "8081:27017"
    deploy:
      replicas: 1
      placement:
        max_replicas_per_node: 1

  pulsar_rest:
    build:
      context: ./docker/pulsar_rest
      dockerfile: Dockerfile
      target: development
    image: pulsar_rest
    profiles: ["pulsar"]
    container_name: pulsar-rest
    privileged: true
    expose:
      - "8913"
    volumes:
      - ./docker/pulsar_rest/app.yml:/opt/pysetup/app.yml
      - /opt/pysetup/files/staging/:/opt/pysetup/files/staging/
      - /var/run/docker.sock:/var/run/docker.sock

  # S3-compatible object store for the smoke tests (tests/smoke_tests.py::test_s3_input).
  # minio/minio is no longer published on Docker Hub; this is Bitnami's frozen MinIO build.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    profiles: ["pulsar"]
    container_name: tesp-minio
    environment:
      - MINIO_ROOT_USER=tesp-test
      - MINIO_ROOT_PASSWORD=tesp-test-secret  # local test credentials only
      - MINIO_DEFAULT_BUCKETS=tesp-test
    ports:
      - "172.17.0.1:9000:9000"  # docker bridge only: reachable by staging containers, not from the network

# Some cloud providers may require a lower MTU!
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1442
